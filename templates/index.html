<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24163a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PhytoDex">
  <title>PhytoDex</title>
  <link rel="icon" href="{{ url_for('static', filename='img/phytodex-icon.svg') }}" type="image/svg+xml">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/phytodex.css', v=asset_version) }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="deck-bar">
    <a class="brand" href="/" data-link>
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 29V13"/><path d="M16 17c-6 0-10-4-10-11 7 0 10 4 10 11Z"/><path d="M16 21c5 0 9-3 9-9-6 0-9 3-9 9Z"/></svg>
      <span>PhytoDex</span>
    </a>
    <nav class="deck-nav" aria-label="Main">
      <a href="/scan" data-link data-nav="scan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Scan</span></a>
      <a href="/garden" data-link data-nav="garden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 13h12l-1.5 7h-9z"/><path d="M12 13V8"/><path d="M12 9c-3 0-5-2-5-5 3 0 5 2 5 5Z"/><path d="M12 10c2.5 0 4.5-1.5 4.5-4-2.5 0-4.5 1.5-4.5 4Z"/></svg><span>My Garden</span></a>
      <a href="/plantdex" data-link data-nav="plantdex"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V10"/><path d="M12 13c-5 0-8-3-8-9 5.5 0 8 3 8 9Z"/><path d="M12 16c4 0 7-2.5 7-7.5-4.5 0-7 2.5-7 7.5Z"/></svg><span>PlantDex</span></a>
      <a href="/ask" data-link data-nav="ask"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4Z"/><path d="M9 10h6"/></svg><span>Ask Phyto</span></a>
      <a href="/system" data-link data-nav="system"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8"/><path d="M8 13h5"/><circle cx="17" cy="15" r="1"/></svg><span>System</span></a>
    </nav>
    <p class="deck-status" id="deck-status" role="status"><span class="dot" aria-hidden="true"></span><span class="label">Checking deck</span></p>
  </header>

  <main id="main" tabindex="-1">
    <noscript><p class="notice notice-error">PhytoDex needs JavaScript turned on in this browser.</p></noscript>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="{{ url_for('static', filename='js/app.js', v=asset_version) }}"></script>
</body>
</html>
