name: PhytoDex tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      AI_MODE: offline
      GEMINI_API_KEY: ''
      GOOGLE_API_KEY: ''
      PHYTODEX_DB_PATH: ${{ github.workspace }}/phytodex-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ai.txt
            requirements-dev.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check teammate integration readiness
        run: python scripts/check_readiness.py
      - name: Run offline tests
        run: python -m pytest --junitxml=test-results.xml
      - name: Require diagnosis for main and pull requests into main
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: python scripts/check_readiness.py --require-team
      - name: Attach test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore
